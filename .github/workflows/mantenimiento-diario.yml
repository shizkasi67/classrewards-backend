name: Mantenimiento Diario

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 05:00 Chile (horario de invierno)
  workflow_dispatch:       # permite ejecutar manualmente desde GitHub

jobs:
  mantener:
    name: Keep-alive y Respaldo
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase (evitar pausa por inactividad)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/cursos?select=cursoid&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responde con status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Obtener fecha actual
        id: fecha
        run: echo "hoy=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Crear respaldo de la base de datos
        run: |
          docker run --rm postgres:17-alpine \
            pg_dump "${{ secrets.DATABASE_URL }}" \
            --no-owner --no-acl \
            > "respaldo_${{ steps.fecha.outputs.hoy }}.sql"

      - name: Cifrar el respaldo (el repo es publico, el artefacto no debe ser legible)
        run: |
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "${{ secrets.BACKUP_PASSPHRASE }}" \
            --symmetric --cipher-algo AES256 \
            -o "respaldo_${{ steps.fecha.outputs.hoy }}.sql.gpg" \
            "respaldo_${{ steps.fecha.outputs.hoy }}.sql"
          rm "respaldo_${{ steps.fecha.outputs.hoy }}.sql"

      - name: Guardar respaldo cifrado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ steps.fecha.outputs.hoy }}
          path: respaldo_*.sql.gpg
          retention-days: 30
          if-no-files-found: error
